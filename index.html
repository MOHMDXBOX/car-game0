<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Realistic 3D Car Game</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#87ceeb; font-family:sans-serif; touch-action:none; user-select:none; }
  canvas { display:block; }
  #hud { position:fixed; top:12px; left:12px; color:#fff; font-size:22px; font-weight:bold; text-shadow:0 2px 4px #000; pointer-events:none; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; background:#000a; font-size:20px; z-index:5; }
  #credit { position:fixed; bottom:4px; right:6px; font:12px sans-serif; color:#fff; opacity:.7; pointer-events:none; }
  #controls { position:fixed; bottom:20px; left:0; right:0; display:flex; justify-content:space-between; padding:0 20px; pointer-events:none; }
  .group { display:flex; gap:12px; pointer-events:auto; }
  .btn { width:72px; height:72px; border-radius:50%; background:#fff3; border:2px solid #fff8; color:#fff; font-size:26px; display:flex; align-items:center; justify-content:center; }
  .btn.active { background:#fff8; }
  #handbrake { width:auto; border-radius:36px; padding:0 18px; font-size:16px; height:56px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>

<div id="loading">جاري تحميل اللعبة...</div>
<div id="hud">0 km/h</div>
<div id="credit">CAR Model by Ignition Labs [CC-BY] via Poly Pizza</div>

<div id="controls">
  <div class="group">
    <div class="btn" data-key="left">◀</div>
    <div class="btn" data-key="right">▶</div>
  </div>
  <div class="group">
    <div class="btn" data-key="brake">■</div>
    <div class="btn" data-key="up">▲</div>
  </div>
</div>
<div style="position:fixed;bottom:110px;left:50%;transform:translateX(-50%);pointer-events:auto;">
  <div class="btn" id="handbrake" data-key="hand">HAND</div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ===== الإعدادات =====
const MAX_SPEED = 90;        // م/ث
const ACCEL = 18;            // م/ث²
const BRAKE = 35;            // م/ث²
const DRAG = 0.02;           // مقاومة الهواء
const ROLL = 0.6;            // مقاومة الدحرجة
const WHEELBASE = 2.7;       // طول القاعدة (م)
const MAX_STEER = 0.6;       // زاوية التوجيه القصوى (راديان)
const WORLD = 150;
const ROAD_HALF = 6;
const CAR_LENGTH = 4.5;
const MODEL_YAW_OFFSET = 0;  // إذا السيارة تمشي للخلف غيّرها إلى Math.PI

// ===== المشهد =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 80, 260);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(40, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
scene.add(sun);

// ===== الأرض والطريق =====
const grass = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD * 2, WORLD * 2),
  new THREE.MeshStandardMaterial({ color: 0x4f9d3a, roughness: 1 })
);
grass.rotation.x = -Math.PI / 2;
grass.receiveShadow = true;
scene.add(grass);

const road = new THREE.Mesh(
  new THREE.PlaneGeometry(ROAD_HALF * 2, WORLD * 2),
  new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 })
);
road.rotation.x = -Math.PI / 2;
road.position.y = 0.02;
road.receiveShadow = true;
scene.add(road);

// خطوط الطريق
for (let z = -WORLD; z < WORLD; z += 6) {
  const line = new THREE.Mesh(
    new THREE.PlaneGeometry(0.3, 3),
    new THREE.MeshStandardMaterial({ color: 0xffffff })
  );
  line.rotation.x = -Math.PI / 2;
  line.position.set(0, 0.03, z);
  scene.add(line);
}

// ===== المباني والأشجار =====
const rnd = (a, b) => a + Math.random() * (b - a);
const buildingMat = new THREE.MeshStandardMaterial({ color: 0x9aa4b2, roughness: 0.6 });
for (let i = 0; i < 40; i++) {
  const h = rnd(8, 35);
  const b = new THREE.Mesh(new THREE.BoxGeometry(rnd(6, 12), h, rnd(6, 12)), buildingMat);
  const side = Math.random() < 0.5 ? -1 : 1;
  b.position.set(side * rnd(ROAD_HALF + 8, WORLD - 10), h / 2, rnd(-WORLD + 10, WORLD - 10));
  b.castShadow = b.receiveShadow = true;
  scene.add(b);
}

const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4423 });
const leafMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32 });
for (let i = 0; i < 80; i++) {
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 3), trunkMat);
  trunk.position.y = 1.5;
  const leaves = new THREE.Mesh(new THREE.SphereGeometry(rnd(1.5, 2.5), 8, 6), leafMat);
  leaves.position.y = 4;
  tree.add(trunk, leaves);
  tree.traverse(o => o.castShadow = true);
  const side = Math.random() < 0.5 ? -1 : 1;
  tree.position.set(side * rnd(ROAD_HALF + 2, WORLD - 5), 0, rnd(-WORLD + 5, WORLD - 5));
  scene.add(tree);
}

// ===== السيارة =====
const carRoot = new THREE.Group();
scene.add(carRoot);

// سيارة احتياطية إذا ما انحمّل الملف
function makeFallbackCar() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2, 0.8, 4.5),
    new THREE.MeshStandardMaterial({ color: 0xcc1111, metalness: 0.5, roughness: 0.3 })
  );
  body.position.y = 0.6;
  body.castShadow = true;
  g.add(body);
  return g;
}

const loader = new GLTFLoader();
const loadingEl = document.getElementById('loading');
let carModel = null;

function placeCar(obj) {
  // توسيط وتحجيم السيارة لطول حوالي 4.5 م
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const scale = CAR_LENGTH / Math.max(size.z, size.x);
  obj.scale.multiplyScalar(scale);
  const box2 = new THREE.Box3().setFromObject(obj);
  const center = box2.getCenter(new THREE.Vector3());
  obj.position.x -= center.x;
  obj.position.z -= center.z;
  obj.position.y -= box2.min.y;
  obj.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  carRoot.add(obj);
  carModel = obj;
}

loader.load(
  'car.glb',
  (gltf) => { placeCar(gltf.scene); loadingEl.style.display = 'none'; },
  undefined,
  () => {
    // إذا فشل التحميل، نستخدم السيارة الاحتياطية
    placeCar(makeFallbackCar());
    loadingEl.style.display = 'none';
  }
);

// ===== التحكم =====
const keys = { up: false, down: false, left: false, right: false, hand: false };
const keyMap = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Space: 'hand',
  KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right'
};
addEventListener('keydown', e => { if (keyMap[e.code]) { keys[keyMap[e.code]] = true; e.preventDefault(); } });
addEventListener('keyup', e => { if (keyMap[e.code]) keys[keyMap[e.code]] = false; });

// أزرار اللمس
const brakeKeyMap = { up: 'up', brake: 'down', left: 'left', right: 'right', hand: 'hand' };
document.querySelectorAll('[data-key]').forEach(btn => {
  const k = brakeKeyMap[btn.dataset.key];
  const on = e => { e.preventDefault(); keys[k] = true; btn.classList.add('active'); };
  const off = e => { e.preventDefault(); keys[k] = false; btn.classList.remove('active'); };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointercancel', off);
  btn.addEventListener('pointerleave', off);
});

// ===== الفيزياء =====
let v = 0;           // السرعة الأمامية
let heading = 0;     // الاتجاه
let steer = 0;       // زاوية التوجيه الحالية
const pos = new THREE.Vector3(0, 0, 0);

function update(dt) {
  // التسارع والفرامل
  if (keys.up && v >= 0) {
    v += ACCEL * dt * (1 - v / MAX_SPEED);
  }
  if (keys.down) {
    if (v > 0.5) v -= BRAKE * dt;
    else v = Math.max(v - ACCEL * 0.5 * dt, -20); // رجوع للخلف
  }

  // الفرامل اليدوية
  if (keys.hand) v *= Math.max(0, 1 - 3 * dt);

  // مقاومة الهواء والدحرجة
  v -= DRAG * v * Math.abs(v) * dt;
  if (!keys.up && !keys.down) v -= Math.sign(v) * ROLL * dt;
  if (Math.abs(v) < 0.05 && !keys.up && !keys.down) v = 0;
  v = THREE.MathUtils.clamp(v, -20, MAX_SPEED);

  // التوجيه
  const target = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
  const maxSteer = keys.hand ? MAX_STEER * 1.4 : MAX_STEER;
  steer += (target * maxSteer - steer) * Math.min(1, dt * 8);
  // التوجيه يقل كلما زادت السرعة
  const effSteer = steer / (1 + Math.abs(v) / 25);

  // نموذج الدراجة (Bicycle Model)
  heading += (v / WHEELBASE) * Math.tan(effSteer) * dt;

  pos.x += Math.sin(heading) * v * dt;
  pos.z += Math.cos(heading) * v * dt;
  pos.x = THREE.MathUtils.clamp(pos.x, -WORLD + 5, WORLD - 5);
  pos.z = THREE.MathUtils.clamp(pos.z, -WORLD + 5, WORLD - 5);

  carRoot.position.copy(pos);
  carRoot.rotation.y = heading + MODEL_YAW_OFFSET;

  // الكاميرا تتبع السيارة من الخلف
  const camOffset = new THREE.Vector3(-Math.sin(heading) * 9, 4.5, -Math.cos(heading) * 9);
  const desired = pos.clone().add(camOffset);
  camera.position.lerp(desired, Math.min(1, dt * 5));
  camera.lookAt(pos.x, 1.2, pos.z);

  document.getElementById('hud').textContent = Math.round(Math.abs(v) * 3.6) + ' km/h';
}

// ===== الحلقة الرئيسية =====
const clock = new THREE.Clock();
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
